<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, minimal-ui">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>TemporalCognition</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      input, textarea {
        font-size: 16px !important;
        background: transparent;
        color: white;
        outline: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      
      /* Prevent scrolling on iOS */
      body {
        -webkit-overflow-scrolling: none;
        overscroll-behavior: none;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=1200 tabindex="-1"></canvas>
    </div>
    <script>
      // Prevent page scroll; in-app ScrollRect handles vertical overflow.
      document.body.addEventListener('touchmove', function(e) {
        e.preventDefault();
      }, { passive: false });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var unityInstance = null;

      // Called from Unity ColorSchemeHandler with the active scheme's Dark Grey.
      function setPageBackgroundColor(color) {
        document.documentElement.style.backgroundColor = color;
        document.body.style.backgroundColor = color;
        if (container) container.style.backgroundColor = color;
        if (canvas) canvas.style.backgroundColor = color;
      }
      window.setPageBackgroundColor = setPageBackgroundColor;

      function updateMobileClass() {
        var isMobile = getViewportSize().width < 768;
        container.className = isMobile ? "unity-mobile" : "";
        canvas.className = isMobile ? "unity-mobile" : "";
      }

      updateMobileClass();

      function getViewportSize() {
        var viewport = window.visualViewport;
        return {
          width: Math.round(viewport ? viewport.width : window.innerWidth),
          height: Math.round(viewport ? viewport.height : window.innerHeight)
        };
      }

      // iOS Safari: use --vh so the container height ignores the address bar.
      function setViewportHeight() {
        var size = getViewportSize();
        var vh = size.height * 0.01;
        document.documentElement.style.setProperty('--vh', vh + 'px');
        document.body.style.height = size.height + 'px';
      }

      function getDeviceCategory(viewportWidth) {
        if (viewportWidth < 768)
          return 'Phone';
        if (viewportWidth < 1200)
          return 'Tablet';
        return 'Desktop';
      }

      function notifyUnityViewport() {
        setViewportHeight();
        updateMobileClass();

        // ee4d165 started sizing the canvas to visualViewport px, which on iOS
        // landscape is often narrower than the page and pillarboxes the game.
        // Restore pre-ee4d165 behavior: CSS 100% fill of the container.
        canvas.style.width = '100%';
        canvas.style.height = '100%';

        var size = {
          width: Math.round(container.clientWidth || window.innerWidth),
          height: Math.round(container.clientHeight || window.innerHeight)
        };

        if (unityInstance) {
          var layout = {
            width: size.width,
            height: size.height,
            category: getDeviceCategory(size.width)
          };
          unityInstance.SendMessage('AdaptiveUISystem', 'SetViewportLayout', JSON.stringify(layout));
        }
      }

      function resizeUnityCanvas() {
        notifyUnityViewport();
      }

      window.addEventListener('resize', resizeUnityCanvas);
      window.addEventListener('orientationchange', function() {
        setTimeout(resizeUnityCanvas, 300);
      });

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resizeUnityCanvas);
        window.visualViewport.addEventListener('scroll', resizeUnityCanvas);
      }

      setViewportHeight();

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/App.loader.js";
      var config = {
        dataUrl: buildUrl + "/App.data",
        frameworkUrl: buildUrl + "/App.framework.js",
        codeUrl: buildUrl + "/App.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "VSNKLab",
        productName: "TemporalCognition",
        productVersion: "1.1",
      };


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          // Progress callback removed since we don't show loading bar
        }).then((instance) => {
          unityInstance = instance;
          resizeUnityCanvas();
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
