<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, minimal-ui">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>TemporalCognition</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      input, textarea {
        font-size: 16px !important;
        background: transparent;
        color: white;
        outline: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      
      /* Prevent scrolling on iOS */
      body {
        -webkit-overflow-scrolling: none;
        overscroll-behavior: none;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=1200 tabindex="-1"></canvas>
    </div>
    <script>
      // Prevent page scroll; in-app ScrollRect handles vertical overflow.
      document.body.addEventListener('touchmove', function(e) {
        e.preventDefault();
      }, { passive: false });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var unityInstance = null;
      // Matches DefaultColorScheme.darkGrey until ColorSchemeHandler syncs the live value.
      var GAME_BACKGROUND = "#2C2C2C";

      function setPageBackgroundColor(color) {
        document.documentElement.style.backgroundColor = color;
        document.body.style.backgroundColor = color;
        if (container) container.style.backgroundColor = color;
        if (canvas) canvas.style.backgroundColor = color;
      }
      window.setPageBackgroundColor = setPageBackgroundColor;

      function updateMobileClass() {
        var size = getViewportSize();
        var isMobile = Math.min(size.width, size.height) < 500;
        container.className = isMobile ? "unity-mobile" : "";
        canvas.className = isMobile ? "unity-mobile" : "";
      }

      updateMobileClass();

      // iOS Safari reports inconsistent sizes during/after orientation changes.
      // Take the max across APIs so the canvas never undersizes and pillarboxes.
      function getViewportSize() {
        var vv = window.visualViewport;
        var width = Math.max(
          window.innerWidth || 0,
          document.documentElement.clientWidth || 0,
          vv ? vv.width : 0
        );
        var height = Math.max(
          window.innerHeight || 0,
          document.documentElement.clientHeight || 0,
          vv ? vv.height : 0
        );
        return {
          width: Math.max(1, Math.round(width)),
          height: Math.max(1, Math.round(height))
        };
      }

      // iOS Safari: --vh tracks the visible height (address bar / landscape chrome).
      function applyViewportCss(size) {
        document.documentElement.style.setProperty('--vh', (size.height * 0.01) + 'px');
        document.body.style.width = size.width + 'px';
        document.body.style.height = size.height + 'px';
        container.style.width = size.width + 'px';
        container.style.height = size.height + 'px';
      }

      function getDeviceCategory(viewportWidth, viewportHeight) {
        // Use the short side so landscape phones stay Phone (width alone would
        // cross the 768 tablet breakpoint and change scale unexpectedly).
        var shortSide = Math.min(viewportWidth, viewportHeight);
        if (shortSide < 500)
          return 'Phone';
        if (viewportWidth < 1200)
          return 'Tablet';
        return 'Desktop';
      }

      var lastNotified = { width: 0, height: 0 };

      function notifyUnityViewport() {
        var size = getViewportSize();
        applyViewportCss(size);
        updateMobileClass();

        // Canvas is CSS 100% of container; only notify Unity when size changes.
        if (size.width === lastNotified.width && size.height === lastNotified.height)
          return;

        lastNotified = size;

        if (unityInstance) {
          var layout = {
            width: size.width,
            height: size.height,
            category: getDeviceCategory(size.width, size.height)
          };
          unityInstance.SendMessage('AdaptiveUISystem', 'SetViewportLayout', JSON.stringify(layout));
          unityInstance.SendMessage('ResizeCanvas', 'SetViewportSize', JSON.stringify(size));
        }
      }

      function resizeUnityCanvas() {
        notifyUnityViewport();
      }

      // After rotate, Safari often fires events before dimensions settle.
      function resizeAfterOrientation() {
        var delays = [0, 50, 100, 200, 350, 500, 800];
        for (var i = 0; i < delays.length; i++)
          setTimeout(resizeUnityCanvas, delays[i]);
      }

      window.addEventListener('resize', resizeUnityCanvas);
      window.addEventListener('orientationchange', resizeAfterOrientation);

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resizeUnityCanvas);
        window.visualViewport.addEventListener('scroll', resizeUnityCanvas);
      }

      if (window.screen && window.screen.orientation && window.screen.orientation.addEventListener) {
        window.screen.orientation.addEventListener('change', resizeAfterOrientation);
      }

      resizeUnityCanvas();

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/App.loader.js";
      var config = {
        dataUrl: buildUrl + "/App.data",
        frameworkUrl: buildUrl + "/App.framework.js",
        codeUrl: buildUrl + "/App.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "VSNKLab",
        productName: "TemporalCognition",
        productVersion: "1.1",
        matchWebGLToCanvasSize: true,
        devicePixelRatio: window.devicePixelRatio || 1,
      };


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          // Progress callback removed since we don't show loading bar
        }).then((instance) => {
          unityInstance = instance;
          lastNotified = { width: 0, height: 0 };
          // Leave splash grey behind as soon as the runtime is up; ColorSchemeHandler
          // will overwrite this with the active scheme's DarkGrey shortly after.
          setPageBackgroundColor(GAME_BACKGROUND);
          resizeAfterOrientation();
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
